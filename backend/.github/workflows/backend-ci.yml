name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irfan_homecare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/irfan_homecare_test
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: "True"
          RATELIMIT_ENABLED: "False"
        run: |
          flask db upgrade

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/irfan_homecare_test
          REDIS_URL: redis://localhost:6379/0
          FLASK_ENV: testing
          TESTING: "True"
          RATELIMIT_ENABLED: "False"
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t irfan-homecare-backend .

  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check formatting
        run: |
          black --check app tests

      - name: Check imports
        run: |
          isort --check app tests

      - name: Lint
        run: |
          flake8 app --max-line-length=120
