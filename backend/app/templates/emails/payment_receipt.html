<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Payment Receipt</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <h2>Payment Receipt - {{ reference }}</h2>
    <p>Dear {{ patient_name }},</p>
    <p>We have successfully received your payment of <strong>KES {{ amount }}</strong> for appointment ref {{ appointment_reference }}.</p>
    <p>Transaction ID: {{ transaction_id }}</p>
    <p>Thank you!</p>
</body>
</html>
