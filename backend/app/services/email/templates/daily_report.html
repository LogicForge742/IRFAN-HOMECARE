<! vapor-html-template>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 550px; margin: 0 auto; }
    .header { font-size: 20px; font-weight: bold; color: #10b981; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">Irfan HomeCare — Daily Executive Digest</div>
    <p>Daily operational report for <strong>{{ date }}</strong>.</p>
    <ul>
      <li>New Appointments: {{ new_appointments }}</li>
      <li>Completed Payments: {{ completed_payments }}</li>
      <li>Total Revenue: KES {{ total_revenue_kes }}</li>
    </ul>
  </div>
</body>
</html>
