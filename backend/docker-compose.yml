version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: irfan_postgres
    restart: always
    environment:
      POSTGRES_USER: irfan_user
      POSTGRES_PASSWORD: irfan_password
      POSTGRES_DB: irfan_homecare_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: irfan_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irfan_backend
    restart: always
    env_file:
      - .env.development
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: irfan_celery_worker
    restart: always
    command: celery -A app.celery_app.celery worker --loglevel=info
    entrypoint: []
    env_file:
      - .env.development
    depends_on:
      - backend
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: irfan_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
